spring:
  application:
    name: flowbit
  config:
    # Read settings from a .env file when one exists: the repository root (when started from
    # backend/) or the working directory. Real environment variables still win.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  webflux:
    multipart:
      # Hard stop for a single uploaded part; the application limit is flowbit.storage.max-upload-size.
      max-disk-usage-per-part: 20MB
  # The application reads and writes over R2DBC.
  r2dbc:
    url: r2dbc:postgresql://${FLOWBIT_DB_HOST:localhost}:${FLOWBIT_DB_PORT:5432}/${FLOWBIT_DB_NAME:flowbit}
    username: ${FLOWBIT_DB_USER:flowbit}
    password: ${FLOWBIT_DB_PASSWORD:flowbit}
  # Flyway migrates the same database over JDBC at startup.
  flyway:
    url: jdbc:postgresql://${FLOWBIT_DB_HOST:localhost}:${FLOWBIT_DB_PORT:5432}/${FLOWBIT_DB_NAME:flowbit}
    user: ${FLOWBIT_DB_USER:flowbit}
    password: ${FLOWBIT_DB_PASSWORD:flowbit}

server:
  port: ${SERVER_PORT:8080}
  # The backend is only reached through the Next.js server, which sets X-Forwarded-* headers.
  forward-headers-strategy: native
  # Stop at once. Graceful shutdown (the default) waits for open requests, and the realtime
  # WebSocket connections never finish, so it sat there for the whole 30 second timeout.
  shutdown: immediate

flowbit:
  # The address people open Flowbit at. Used in the single sign-on redirect URI and in the links
  # of mails and API notifications. Empty: single sign-on works it out from the request, and
  # notifications carry a path (/issue/FB-12) instead of a full address.
  public-url: ${FLOWBIT_PUBLIC_URL:}
  secrets:
    # The passphrase (16+ characters) the secrets kept in the database are encrypted with: LDAP/SSO secrets, the mail
    # password, the Firebase key, webhook and Git secrets (D-226). Empty: they are stored as they are. Once set, do not lose
    # or change it: what was encrypted with it cannot be read without it. Plain-text secrets are encrypted at the next start.
    key: ${FLOWBIT_SECRET_KEY:}
  notifications:
    # Where web push messages are sent. Only tests point this elsewhere.
    fcm-url: https://fcm.googleapis.com
    # What one person does to one issue goes out as one notification once they have left it alone
    # this long, or closed it (D-126). 0s sends every change at once.
    batch-delay: 1m
    # Sent this long after their first change even if they keep changing it.
    batch-max-delay: 10m
  retention:
    # Removes deleted issues, documents and comments once they are older than the periods an
    # administrator set (D-132). Integration tests switch it off and run it themselves.
    enabled: true
    initial-delay: 1m
    interval: 1h
  daily-summary:
    # Sends the daily summary to the members an administrator switched it on for, at the time set for them (D-216),
    # and forgets inbox notifications older than 90 days. Integration tests switch it off and call the service themselves.
    enabled: true
    initial-delay: 30s
    interval: 1m
  git:
    # GitHub App connections that cannot receive webhooks read the GitHub API this often (D-146).
    # Integration tests switch it off and sync by hand.
    sync-enabled: true
    sync-interval: 2m
  storage:
    # Where uploaded files are kept. Relative paths are resolved against the working directory.
    path: ${FLOWBIT_STORAGE_PATH:./data/uploads}
    # Where the files go: local (the storage folder above) or amazon-s3 (the bucket below). Read once, at start (D-181).
    # Left out: amazon-s3 when FLOWBIT_S3_BUCKET is given, local otherwise (D-167).
    type: ${FLOWBIT_STORAGE_TYPE:}
    s3:
      bucket: ${FLOWBIT_S3_BUCKET:}
      region: ${FLOWBIT_S3_REGION:}
      # Only for an S3-compatible store (MinIO, …); AWS needs none.
      endpoint: ${FLOWBIT_S3_ENDPOINT:}
      # Both, or neither: then the SDK's usual places (AWS_ACCESS_KEY_ID…, a role on the server).
      access-key: ${FLOWBIT_S3_ACCESS_KEY:}
      secret-key: ${FLOWBIT_S3_SECRET_KEY:}
      prefix: ${FLOWBIT_S3_PREFIX:}
      path-style: ${FLOWBIT_S3_PATH_STYLE:}
    max-upload-size: ${FLOWBIT_MAX_UPLOAD_SIZE:5MB}
  auth:
    max-failed-logins: 5
    lock-duration: 15m
    session-idle-timeout: 7d
    session-max-age: 30d
    rate-limit-per-minute: 10
