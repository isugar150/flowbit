name: CI

# 백엔드는 ktlint + 통합 테스트(Testcontainers 가 PostgreSQL 18 을 띄운다), 프런트엔드는 lint·타입 검사·단위 테스트·빌드.
# E2E(Playwright)는 별도 백엔드·DB·Next 서버가 필요해서 여기서 돌리지 않는다(docs/04-frontend-guide.md "테스트와 검사").
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ktlint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: |
          chmod +x ./gradlew
          ./gradlew check --console=plain
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
