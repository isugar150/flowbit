# 로컬 개발용 PostgreSQL. 값은 .env 로 바꿀 수 있다 (.env.example 참고).
#   개발(DB 만):          docker compose up -d
#   앱까지 컨테이너로:    docker compose --profile app up -d --build   → http://localhost:3000
#   서버 배포는 script/ (Docker Hub 의 이미지를 받아 띄운다. docs/02-architecture.md)
name: flowbit

services:
  postgres:
    image: postgres:18
    container_name: flowbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWBIT_DB_NAME:-flowbit}
      POSTGRES_USER: ${FLOWBIT_DB_USER:-flowbit}
      POSTGRES_PASSWORD: ${FLOWBIT_DB_PASSWORD:-flowbit}
      TZ: UTC
    ports:
      # 개발 PC 에서만 접근하도록 localhost 에만 연다
      - "127.0.0.1:${FLOWBIT_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지부터 데이터 경로가 /var/lib/postgresql/<버전>/docker 로 바뀌어
      # /var/lib/postgresql 전체를 마운트한다 (/var/lib/postgresql/data 가 아님)
      - postgres-data:/var/lib/postgresql
      # 볼륨이 처음 만들어질 때 한 번 실행된다 (E2E 테스트용 flowbit_e2e DB 생성)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --profile app 일 때만 뜬다. 개발할 때는 백엔드와 프런트를 직접 실행한다.
  # 백엔드와 프런트가 한 이미지에 들어 있다 (루트의 Dockerfile).
  app:
    profiles: ["app"]
    build: .
    image: flowbit
    container_name: flowbit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLOWBIT_DB_HOST: postgres
      # 컨테이너끼리는 PostgreSQL 의 원래 포트로 붙는다 (FLOWBIT_DB_PORT 는 호스트에 여는 포트)
      FLOWBIT_DB_PORT: 5432
      FLOWBIT_DB_NAME: ${FLOWBIT_DB_NAME:-flowbit}
      FLOWBIT_DB_USER: ${FLOWBIT_DB_USER:-flowbit}
      FLOWBIT_DB_PASSWORD: ${FLOWBIT_DB_PASSWORD:-flowbit}
      FLOWBIT_MAX_UPLOAD_SIZE: ${FLOWBIT_MAX_UPLOAD_SIZE:-5MB}
      FLOWBIT_PUBLIC_URL: ${FLOWBIT_PUBLIC_URL:-}
      FLOWBIT_SECRET_KEY: ${FLOWBIT_SECRET_KEY:-}
      FLOWBIT_STORAGE_TYPE: ${FLOWBIT_STORAGE_TYPE:-}
      FLOWBIT_S3_BUCKET: ${FLOWBIT_S3_BUCKET:-}
      FLOWBIT_S3_REGION: ${FLOWBIT_S3_REGION:-}
      FLOWBIT_S3_ENDPOINT: ${FLOWBIT_S3_ENDPOINT:-}
      FLOWBIT_S3_ACCESS_KEY: ${FLOWBIT_S3_ACCESS_KEY:-}
      FLOWBIT_S3_SECRET_KEY: ${FLOWBIT_S3_SECRET_KEY:-}
      FLOWBIT_S3_PREFIX: ${FLOWBIT_S3_PREFIX:-}
      FLOWBIT_S3_PATH_STYLE: ${FLOWBIT_S3_PATH_STYLE:-}
      TZ: UTC
    volumes:
      # 올린 이미지. 백업 대상이다
      - uploads:/var/lib/flowbit/uploads
    ports:
      # 프런트(3000)만 연다. 백엔드는 컨테이너 안에서 프런트의 /api 를 거쳐서만 닿는다.
      # FLOWBIT_WEB_BIND=127.0.0.1 이면 이 PC 안에서만 열린다
      - "${FLOWBIT_WEB_BIND:-0.0.0.0}:${FLOWBIT_WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  uploads:
