# Flowbit behind nginx, HTTP (port 80) only.
#
# Optional. Only needed when this server answers for several domains, or port 80 is already
# nginx's. Otherwise set FLOWBIT_WEB_PORT=80 in .env and Flowbit answers on port 80 by itself.
#
# Requests for the domain below are handed to the Flowbit frontend container (script/deploy.sh).
# The frontend passes /api and the realtime WebSocket on to the backend itself, so nginx only
# needs this one upstream and the backend is never reachable from outside.
#
# Install (Ubuntu/Debian; on RHEL-likes copy it to /etc/nginx/conf.d/flowbit.conf instead):
#   1. Change `server_name` below to the real domain.
#   2. sudo cp flowbit.conf /etc/nginx/sites-available/flowbit.conf
#      sudo ln -s /etc/nginx/sites-available/flowbit.conf /etc/nginx/sites-enabled/flowbit.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# In .env set FLOWBIT_WEB_BIND=127.0.0.1 so the frontend is only reachable through nginx, and
# FLOWBIT_PUBLIC_URL=http://<the domain>; then run script/deploy.sh again.

# "Connection: upgrade" only for requests that ask for an upgrade (the realtime WebSocket).
map $http_upgrade $flowbit_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream flowbit_frontend {
    # The frontend port: FLOWBIT_WEB_PORT in .env (default 3000).
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Only requests for this domain come here.
    server_name flowbit.example.com;

    # The backend refuses a single uploaded file above 20MB; stop larger bodies here.
    client_max_body_size 20m;

    location / {
        proxy_pass http://flowbit_frontend;
        proxy_http_version 1.1;

        # The realtime connection checks that the page's Origin is this host, so Host must be
        # passed on as the browser sent it.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/api/v1/realtime).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $flowbit_connection_upgrade;

        # The server pings an open realtime connection every 20 seconds; anything quieter than
        # this is dead.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
