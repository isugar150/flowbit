# Flowbit on a server, from the images on Docker Hub (isugar150/flowbit). Nothing is built here.
# The server needs Docker only: copy this file and deploy.sh into one folder and run ./deploy.sh
# Settings come from .env next to this file (deploy.sh creates it on the first run).
#
# The database is NOT part of this: Flowbit connects to an existing PostgreSQL 18 whose address
# and account are in .env (FLOWBIT_DB_*). The backend creates its tables there when it starts.
#
# The images are made and pushed on a development PC with script/push.sh:
#   isugar150/flowbit:backend-<version>    isugar150/flowbit:frontend-<version>
name: flowbit

services:
  backend:
    image: ${FLOWBIT_IMAGE:-isugar150/flowbit}:backend-${FLOWBIT_VERSION:-latest}
    container_name: flowbit-backend
    restart: unless-stopped
    environment:
      FLOWBIT_DB_HOST: ${FLOWBIT_DB_HOST:?Set FLOWBIT_DB_HOST in .env}
      FLOWBIT_DB_PORT: ${FLOWBIT_DB_PORT:-5432}
      FLOWBIT_DB_NAME: ${FLOWBIT_DB_NAME:-flowbit}
      FLOWBIT_DB_USER: ${FLOWBIT_DB_USER:?Set FLOWBIT_DB_USER in .env}
      FLOWBIT_DB_PASSWORD: ${FLOWBIT_DB_PASSWORD:?Set FLOWBIT_DB_PASSWORD in .env}
      FLOWBIT_MAX_UPLOAD_SIZE: ${FLOWBIT_MAX_UPLOAD_SIZE:-5MB}
      FLOWBIT_PUBLIC_URL: ${FLOWBIT_PUBLIC_URL:-}
      TZ: UTC
    extra_hosts:
      # A database on this same server: inside the container "localhost" is the container
      # itself, so use FLOWBIT_DB_HOST=host.docker.internal to reach the server.
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded files. Back this up together with the database.
      - uploads:/var/lib/flowbit/uploads
    # No port: browsers reach the backend only through the frontend's /api.

  frontend:
    # Built with BACKEND_URL=http://backend:8080, so the service above must be called "backend".
    image: ${FLOWBIT_IMAGE:-isugar150/flowbit}:frontend-${FLOWBIT_VERSION:-latest}
    container_name: flowbit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      # FLOWBIT_WEB_BIND=127.0.0.1 opens it to this server only (nginx in front).
      - "${FLOWBIT_WEB_BIND:-0.0.0.0}:${FLOWBIT_WEB_PORT:-3000}:3000"

volumes:
  uploads:
